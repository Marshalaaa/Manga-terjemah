name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Kamus Tatoeba diunduh & disaring otomatis, lalu ikut masuk ke APK.
      - name: Buat kamus Tatoeba
        run: python3 scripts/buat_kamus_tatoeba.py app/src/main/assets/tatoeba_ja_id.tsv

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MangaTerjemah-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kamus-tatoeba
          path: app/src/main/assets/tatoeba_ja_id.tsv
